name: Build EnvironmentSmart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract EnvironmentSmart project
        run: |
          unzip -o EnvironmentSmart_CLEAN_FINAL_V1.zip
          echo "Project extracted successfully"

      - name: Build APK
        run: |
          cd EnvironmentSmart
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmentSmart-APK
          path: EnvironmentSmart/app/build/outputs/apk/debug/app-debug.apk
