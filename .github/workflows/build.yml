name: Build Environment Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: إعداد Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: تثبيت Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: فك مشروع البيئة الذكية
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'EnvironmentSmart_v1_APK_Project_FIXED.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف المشروع"
            exit 1
          fi

          echo "ملف المشروع: $ZIP_FILE"

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src

      - name: العثور على مشروع Android
        run: |
          SETTINGS=$(find build-src -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "لم يتم العثور على settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "مجلد المشروع: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: تفعيل AndroidX
        run: |
          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: بناء APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmentSmart-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
