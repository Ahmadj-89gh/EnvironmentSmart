name: Build Environment Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract FINAL project
        run: |
          set -e
          test -f EnvironmentSmart_FINAL_READY.zip
          rm -rf build-src
          mkdir -p build-src
          unzip -q EnvironmentSmart_FINAL_READY.zip -d build-src

      - name: Find Android project
        run: |
          set -e
          SETTINGS=$(find build-src -name "settings.gradle" -type f | head -n 1)
          test -n "$SETTINGS"
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Enable AndroidX
        run: |
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\n" > "$PROJECT_DIR/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon clean assembleDebug

      - name: Verify APK
        run: |
          test -f "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ls -lh "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmentSmart-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
