name: Build Environment Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Environment Smart project
        run: |
          set -e

          echo "Searching for EnvironmentSmart_Map_Ready.zip..."

          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'EnvironmentSmart_Map_Ready.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: EnvironmentSmart_Map_Ready.zip was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          echo "Found project ZIP:"
          echo "$ZIP_FILE"

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src

          echo "Project extracted successfully."

      - name: Find Android project
        run: |
          set -e

          SETTINGS=$(find build-src -name settings.gradle -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle was not found."
            echo "Extracted files:"
            find build-src -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Enable AndroidX
        run: |
          set -e

          echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"
          echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

          echo "gradle.properties:"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean project
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Cleaning project..."

          gradle --no-daemon clean

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Starting APK build..."

          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK successfully created:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmentSmart-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
