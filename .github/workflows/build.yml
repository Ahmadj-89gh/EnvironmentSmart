name: Build Environment Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Use NEW Environment Smart project
        run: |
          set -e

          ZIP_FILE="EnvironmentSmart_Map_Ready_FIXED.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: NEW project ZIP not found:"
            echo "$ZIP_FILE"
            echo ""
            echo "Files currently in repository:"
            ls -lah
            exit 1
          fi

          echo "========================================"
          echo "USING NEW PROJECT:"
          echo "$ZIP_FILE"
          echo "========================================"

          rm -rf build-src
          mkdir -p build-src

          unzip -q "$ZIP_FILE" -d build-src

      - name: Find Android project
        run: |
          set -e

          SETTINGS=$(find build-src -name "settings.gradle" -type f | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."

            echo "Project files:"
            find build-src -maxdepth 6 -type f | head -150

            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "========================================"
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"
          echo "========================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify NEW MainActivity
        run: |
          set -e

          MAIN_FILE="$PROJECT_DIR/app/src/main/java/com/environment/smart/MainActivity.java"

          if [ ! -f "$MAIN_FILE" ]; then
            echo "ERROR: MainActivity.java not found."
            exit 1
          fi

          echo "========================================"
          echo "NEW MainActivity found:"
          echo "$MAIN_FILE"
          echo "========================================"

          grep -q "ArcGIS World Imagery" "$MAIN_FILE" || {
            echo "ERROR: New map features were not found."
            exit 1
          }

          grep -q "MapEventsOverlay" "$MAIN_FILE" || {
            echo "ERROR: New map event system was not found."
            exit 1
          }

          echo "NEW MAP FEATURES VERIFIED."

      - name: Enable AndroidX
        run: |
          set -e

          touch "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.useAndroidX=true" "$PROJECT_DIR/gradle.properties" \
            || echo "android.useAndroidX=true" >> "$PROJECT_DIR/gradle.properties"

          grep -qxF "android.enableJetifier=true" "$PROJECT_DIR/gradle.properties" \
            || echo "android.enableJetifier=true" >> "$PROJECT_DIR/gradle.properties"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean project
        run: |
          set -e

          cd "$PROJECT_DIR"

          gradle --no-daemon clean

      - name: Build APK
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILDING ENVIRONMENT SMART APK"
          echo "========================================"

          gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK SUCCESSFULLY CREATED"
          echo "$APK"
          ls -lh "$APK"
          echo "========================================"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnvironmentSmart-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
